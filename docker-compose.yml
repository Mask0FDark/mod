services:
  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-m0d-app}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - m0d_data:/data
    ports:
      - "${APP_BIND:-127.0.0.1:8095}:3000"
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-m0d-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - m0d_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  turn:
    image: coturn/coturn:4.6.3
    container_name: ${TURN_CONTAINER_NAME:-m0d-turn}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --listening-ip=0.0.0.0
      - --listening-port=${TURN_PORT:-3478}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers

volumes:
  m0d_pg:
    name: ${DB_VOLUME_NAME:-m0d_pg}
  m0d_data:
    name: ${DATA_VOLUME_NAME:-m0d_data}
